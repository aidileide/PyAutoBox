  <g fill="#172033" font-family="Arial, sans-serif" font-size="21" font-weight="700">
    <text x="105" y="370">PDF Merge</text>
    <text x="465" y="370">Excel Merge</text>
    <text x="825" y="370">Image Compress</text>
    <text x="105" y="525">Batch Rename</text>
    <text x="465" y="525">Markdown to PDF</text>
