<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title">
  <title id="title">PyAutoBox Web UI screenshot placeholder</title>
  <rect width="1200" height="680" rx="28" fill="#f6f7fb"/>
  <rect x="45" y="32" width="1110" height="62" rx="16" fill="#fff" stroke="#e4e7ec"/>
  <rect x="72" y="47" width="34" height="34" rx="10" fill="#4f46e5"/>
  <text x="122" y="71" fill="#172033" font-family="Arial, sans-serif" font-size="22" font-weight="700">PyAutoBox</text>
  <text x="600" y="166" text-anchor="middle" fill="#4f46e5" font-family="Arial, sans-serif" font-size="14" font-weight="700">PERSONAL AUTOMATION TOOLBOX</text>
  <text x="600" y="222" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="54" font-weight="700">PyAutoBox</text>
  <text x="600" y="260" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="22">Simple tools. Less repetitive work.</text>
  <g fill="#fff" stroke="#e4e7ec">
    <rect x="75" y="320" width="330" height="130" rx="18"/>
    <rect x="435" y="320" width="330" height="130" rx="18"/>
    <rect x="795" y="320" width="330" height="130" rx="18"/>
    <rect x="75" y="475" width="330" height="130" rx="18"/>
    <rect x="435" y="475" width="330" height="130" rx="18"/>
