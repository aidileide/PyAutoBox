<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PyAutoBox personal automation toolbox">
    <title>{% block title %}PyAutoBox{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="PyAutoBox 首页">
        <span class="brand-mark">P</span>
        <span>PyAutoBox</span>
      </a>
      <span class="version-chip">v{{ version }}</span>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <a href="https://github.com/aidileide/PyAutoBox" target="_blank" rel="noreferrer">GitHub</a>
      <span>Version {{ version }}</span>
      <span>MIT License</span>
    </footer>
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </body>
</html>
