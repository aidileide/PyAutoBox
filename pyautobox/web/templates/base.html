<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PyAutoBox 是一款开源、隐私优先的本地自动化与格式转换工具箱。">
  <meta name="theme-color" content="#f4f5f7">
  <title>{% block title %}PyAutoBox · 本地万能工具箱{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}?v={{ version }}">
  <script src="{{ url_for('static', path='/js/app.js') }}?v={{ version }}" defer></script>
  <script src="{{ url_for('static', path='/js/legacy.js') }}?v={{ version }}" defer></script>
</head>
<body data-tool="{{ tool or 'home' }}">
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="返回 PyAutoBox 首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 7.5 16 3l8 4.5v9L16 21l-8-4.5v-9Z"/><path d="m8 7.5 8 4.5 8-4.5M16 12v9"/><path d="M11 20.5 16 23l5-2.5V25l-5 3-5-3v-4.5Z"/></svg></span><span class="brand-copy"><strong>PyAutoBox</strong><small>本地万能工具箱</small></span></a>
    <nav class="site-nav" aria-label="主导航"><a href="/">首页</a><a href="/#tools">工具箱</a><a href="/#privacy">隐私</a></nav>
    <div class="header-actions"><span class="local-pill"><span class="status-dot"></span>本地运行中</span><button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色模式"><span>◐</span></button></div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><div class="footer-brand"><strong>PyAutoBox</strong><span>自动化与格式转换，一站完成。</span></div><div class="footer-meta"><a href="https://github.com/aidileide/PyAutoBox">GitHub</a><span>MIT · v{{ version }}</span></div></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
